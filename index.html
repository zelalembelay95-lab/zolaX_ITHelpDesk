<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispatch — IT Helpdesk Queue</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10161c;
    --panel:#1a222b;
    --panel-2:#212b35;
    --border:#2b3742;
    --text:#edefe9;
    --muted:#8b96a3;
    --amber:#e8a33d;
    --teal:#4fa88c;
    --coral:#e2593f;
    --cyan:#57d3d9;
    --amber-dim:#4a3a20;
    --teal-dim:#1e3530;
    --coral-dim:#3d251f;
    --cyan-dim:#173539;
    --radius:3px;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
    --head:'Space Grotesk', system-ui, sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#10161c; --panel:#1a222b; --panel-2:#212b35; --border:#2b3742; --text:#edefe9; --muted:#8b96a3;
    }
  }
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  #netbg{
    position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55;
  }
  #app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  ::selection{background:var(--amber);color:#1a1206}

  /* ---------- motion ---------- */
  @keyframes fadeSlideUp{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes glowPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(226,89,63,.55) }
    50%{ box-shadow:0 0 0 6px rgba(226,89,63,0) }
  }
  @keyframes dotPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,163,61,.55) }
    50%{ box-shadow:0 0 0 6px rgba(232,163,61,0) }
  }
  @keyframes sweep{
    0%{ background-position:-200% 0 }
    100%{ background-position:200% 0 }
  }
  @keyframes ticklight{
    0%{ opacity:.3 } 50%{ opacity:1 } 100%{ opacity:.3 }
  }
  main, .loginwrap{ animation:fadeIn .45s ease both }
  .stub{ animation:fadeSlideUp .4s ease both }
  .stub:nth-child(1){animation-delay:.02s}
  .stub:nth-child(2){animation-delay:.06s}
  .stub:nth-child(3){animation-delay:.10s}
  .stub:nth-child(4){animation-delay:.14s}
  .stub:nth-child(5){animation-delay:.18s}
  .stub:nth-child(6){animation-delay:.22s}
  .stub:nth-child(n+7){animation-delay:.24s}
  @media (prefers-reduced-motion: reduce){
    main,.loginwrap,.stub,.servingnum{animation:none !important}
    #netbg{display:none}
  }

  /* ---------- layout shells ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;border-bottom:1px solid var(--border);
    background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    gap:12px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:600;font-size:17px;letter-spacing:.2px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);animation:dotPulse 2.2s ease-out infinite}
  .whoami{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .whoami b{color:var(--text);font-weight:600}
  .pill{
    font-family:var(--mono);font-size:11px;letter-spacing:.03em;
    padding:3px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted)
  }
  .btn{
    border:1px solid var(--border);background:var(--panel-2);color:var(--text);
    padding:9px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:600;
    transition:border-color .15s, background .15s, box-shadow .2s, transform .12s;
  }
  .btn:hover{border-color:#3c4a58;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--amber); outline-offset:2px;
  }
  .btn-primary{background:var(--amber);border-color:var(--amber);color:#1a1206}
  .btn-primary:hover{background:#f0ae4c;box-shadow:0 0 0 4px rgba(232,163,61,.18)}
  .btn-quiet{background:transparent;border-color:transparent;color:var(--muted)}
  .btn-quiet:hover{color:var(--text)}
  .btn-danger{border-color:var(--coral);color:var(--coral);background:transparent}
  .btn-danger:hover{background:var(--coral-dim)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

  .shell{display:flex;flex:1;min-height:0}
  .nav{
    width:198px;flex:none;border-right:1px solid var(--border);background:var(--panel);
    padding:18px 10px;display:flex;flex-direction:column;gap:2px;
  }
  .nav button{
    text-align:left;background:transparent;border:none;color:var(--muted);
    padding:10px 12px;border-radius:var(--radius);font-size:14px;font-weight:600;
    transition:background .15s, color .15s, box-shadow .2s;
  }
  .nav button:hover{color:var(--text);background:var(--panel-2)}
  .nav button.active{color:var(--text);background:var(--panel-2);box-shadow:inset 3px 0 0 var(--amber), 0 0 14px -6px var(--amber)}
  .nav .navhead{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:#5b6672;padding:8px 12px 4px}

  main{flex:1;min-width:0;padding:28px clamp(16px,4vw,40px);overflow-x:auto}
  .maxw{max-width:920px}

  h1{font-family:var(--head);font-size:26px;font-weight:600;margin:0 0 4px}
  h2{font-family:var(--head);font-size:18px;font-weight:600;margin:0 0 14px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 26px}

  /* ---------- login / hero ---------- */
  .loginwrap{flex:1;display:flex;align-items:stretch;min-height:100vh}
  .loginleft{
    flex:1.15;display:flex;flex-direction:column;justify-content:center;
    padding:clamp(28px,6vw,72px);border-right:1px solid var(--border);
    background:
      radial-gradient(circle at 15% 20%, rgba(232,163,61,.07), transparent 45%),
      var(--bg);
    position:relative;overflow:hidden;
  }
  .loginright{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;min-width:320px}
  .servingtag{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--amber);margin-bottom:14px}
  .servingnum{
    font-family:var(--head);font-weight:700;font-size:clamp(88px,13vw,168px);line-height:.9;
    letter-spacing:-.02em;color:var(--text);
    animation:flipin .7s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(100deg, var(--text) 40%, var(--cyan) 50%, var(--text) 60%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    animation:flipin .7s cubic-bezier(.2,.8,.2,1), sweep 5s linear infinite 1s;
  }
  @media (prefers-reduced-motion: reduce){ .servingnum{animation:none;-webkit-text-fill-color:var(--text)} }
  @keyframes flipin{
    0%{opacity:0;transform:translateY(18px) scale(.96)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  .servingsub{color:var(--muted);font-size:15px;margin-top:10px;max-width:460px;line-height:1.55}
  .queuestrip{display:flex;gap:22px;margin-top:38px;flex-wrap:wrap}
  .qstat{border-left:2px solid var(--border);padding-left:12px}
  .qstat b{display:block;font-family:var(--mono);font-size:22px;color:var(--text)}
  .qstat span{font-size:12px;color:var(--muted)}

  .loginbox{width:100%;max-width:360px}
  .loginbox h1{font-size:20px;margin-bottom:4px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input, .field select, .field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:var(--radius);
  }
  .field textarea{resize:vertical;min-height:84px;line-height:1.5}
  .formerr{color:var(--coral);font-size:13px;margin:-4px 0 12px;min-height:1em}
  .demohint{
    margin-top:22px;padding:12px 14px;border:1px dashed var(--border);border-radius:var(--radius);
    font-size:12.5px;color:var(--muted);line-height:1.7;
  }
  .demohint b{color:var(--text);font-family:var(--mono);font-weight:600}

  /* ---------- ticket stub cards ---------- */
  .stub{
    display:grid;grid-template-columns:76px 1fr auto;gap:0;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:12px;overflow:hidden;align-items:stretch;
    transition:border-color .18s, box-shadow .18s, transform .18s;
  }
  .stub:hover{border-color:#39485a;box-shadow:0 6px 20px -10px rgba(87,211,217,.25);transform:translateY(-1px)}
  .stubnum{
    background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-right:1px dashed var(--border);position:relative;padding:10px 4px;
  }
  .stubnum::before,.stubnum::after{
    content:"";position:absolute;width:14px;height:14px;background:var(--bg);border-radius:50%;right:-7px;
  }
  .stubnum::before{top:-7px}
  .stubnum::after{bottom:-7px}
  .stubnum b{font-family:var(--mono);font-size:19px}
  .stubnum span{font-family:var(--mono);font-size:9.5px;color:var(--cyan);letter-spacing:.05em}
  .stubbody{padding:14px 18px;min-width:0}
  .stubtitle{font-weight:600;font-size:14.5px;margin-bottom:3px}
  .stubmeta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .stubdesc{font-size:13px;color:#b8c0c9;line-height:1.5;max-width:56ch}
  .stubside{padding:14px 16px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:8px;border-left:1px solid var(--border)}
  .badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .badge-open{background:var(--amber-dim);color:var(--amber)}
  .badge-progress{background:#2a3a4d;color:#7fb0e0}
  .badge-resolved{background:var(--teal-dim);color:var(--teal)}
  .badge-crit{background:var(--coral-dim);color:var(--coral);animation:glowPulse 1.8s ease-out infinite}
  .rankline{font-size:12px;color:var(--muted);text-align:right}
  .rankline b{color:var(--text);font-family:var(--mono)}
  .stubactions{display:flex;gap:6px}
  .stubactions .btn{padding:6px 11px;font-size:12.5px}

  .empty{
    border:1px dashed var(--border);border-radius:var(--radius);padding:36px 22px;text-align:center;
    color:var(--muted);font-size:14px;
  }

  /* ---------- new request ---------- */
  .redirect{
    border:1px solid var(--coral);background:var(--coral-dim);border-radius:var(--radius);
    padding:16px 18px;font-size:13.5px;line-height:1.6;margin-top:4px;
  }
  .redirect b{display:block;font-family:var(--head);font-size:15px;margin-bottom:4px;color:var(--text)}
  .sevrow{display:flex;gap:8px;flex-wrap:wrap}
  .sevchip{
    border:1px solid var(--border);background:var(--panel-2);padding:8px 13px;border-radius:20px;
    font-size:12.5px;font-weight:600;color:var(--muted);transition:all .15s;
  }
  .sevchip:hover{border-color:#3c4a58;color:var(--text)}
  .sevchip.on{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);box-shadow:0 0 0 3px rgba(232,163,61,.12)}

  /* ---------- tables (admin) ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border)}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--panel-2)}
  tr:last-child td{border-bottom:none}
  .taghdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
  .titletag{font-size:11.5px;font-family:var(--mono);padding:2px 7px;border:1px solid var(--border);border-radius:20px;color:var(--muted)}
  .rolebadges{display:flex;gap:6px}
  .numinput{width:74px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:var(--radius)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:560px){.grid2{grid-template-columns:1fr}}
  .msgbar{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--border);padding:10px 18px;border-radius:var(--radius);
    font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:100;
  }
  .footnote{margin-top:26px;font-size:12px;color:#5b6672;line-height:1.7}
  code{font-family:var(--mono);background:var(--panel-2);padding:1px 5px;border-radius:3px;font-size:12px}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
</style>

<script>
/* =====================================================================
   AMBIENT NETWORK BACKGROUND
   Drifting nodes with connecting lines when they're near each other —
   a nod to the network this helpdesk is actually monitoring. Purely
   decorative, low-opacity, paused for reduced-motion users.
===================================================================== */
(function(){
  const canvas = document.getElementById('netbg');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ctx = canvas.getContext('2d');
  let w, h, nodes;

  function resize(){
    w = canvas.width = window.innerWidth * devicePixelRatio;
    h = canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    const count = Math.min(70, Math.round((window.innerWidth * window.innerHeight) / 26000));
    nodes = Array.from({length: count}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.25 * devicePixelRatio,
      vy: (Math.random() - 0.5) * 0.25 * devicePixelRatio,
    }));
  }

  function step(){
    ctx.clearRect(0, 0, w, h);
    const linkDist = 140 * devicePixelRatio;
    for(const n of nodes){
      n.x += n.vx; n.y += n.vy;
      if(n.x < 0 || n.x > w) n.vx *= -1;
      if(n.y < 0 || n.y > h) n.vy *= -1;
    }
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a = nodes[i], b = nodes[j];
        const dx = a.x-b.x, dy = a.y-b.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < linkDist){
          ctx.strokeStyle = `rgba(87,211,217,${0.16 * (1 - dist/linkDist)})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    for(const n of nodes){
      ctx.fillStyle = 'rgba(232,163,61,.55)';
      ctx.beginPath(); ctx.arc(n.x, n.y, 1.6 * devicePixelRatio, 0, Math.PI*2); ctx.fill();
    }
    if(!reduceMotion) requestAnimationFrame(step);
  }

  resize();
  window.addEventListener('resize', resize);
  if(reduceMotion){ step(); } else { requestAnimationFrame(step); }
})();

/* Animated count-up used on the login hero number. */
function animateCount(el, target){
  if(!el) return;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion){ el.textContent = '#' + String(target).padStart(3,'0'); return; }
  const start = performance.now(), dur = 900;
  function frame(now){
    const p = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    const val = Math.round(eased * target);
    el.textContent = '#' + String(val).padStart(3,'0');
    if(p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
<script>
/* =====================================================================
   DATA LAYER
   Everything in this block is the only place that touches storage.
   Right now it reads/writes localStorage so the app is fully usable
   as a standalone demo. To go live, swap the bodies of these functions
   for Supabase calls (data) and Firebase Auth calls (login/session) —
   see README.md for the exact swap-in code.
===================================================================== */
const LS = {
  users: 'itq_users_v1',
  tickets: 'itq_tickets_v1',
  categories: 'itq_categories_v1',
  session: 'itq_session_v1',
};

const DEFAULT_CATEGORIES = [
  {id:'server',    label:'Server / core system down',      dept:'IT',      weight:100, avgMin:55},
  {id:'net',       label:'Network / internet down',        dept:'IT',      weight:95,  avgMin:40},
  {id:'pcdown',    label:"Computer won't turn on",          dept:'IT',      weight:80,  avgMin:35},
  {id:'printer',   label:'Printer not working',            dept:'IT',      weight:70,  avgMin:25},
  {id:'email',     label:'Email not working',              dept:'IT',      weight:65,  avgMin:20},
  {id:'login',     label:"Can't log in / password reset",  dept:'IT',      weight:60,  avgMin:15},
  {id:'software',  label:'Software install or error',      dept:'IT',      weight:45,  avgMin:20},
  {id:'other-it',  label:'Other IT issue',                 dept:'IT',      weight:40,  avgMin:20},
  {id:'peripheral',label:'Mouse, keyboard or monitor',      dept:'IT',      weight:35,  avgMin:15},
  {id:'media',     label:'Media player (e.g. VLC) issue',  dept:'IT',      weight:15,  avgMin:10},
  {id:'payroll',   label:'Payroll / salary issue',         dept:'Finance', weight:0,   avgMin:0},
  {id:'expense',   label:'Expense / reimbursement',        dept:'Finance', weight:0,   avgMin:0},
  {id:'leave',     label:'Leave / attendance request',     dept:'HR',      weight:0,   avgMin:0},
  {id:'hiring',    label:'Hiring / staffing question',     dept:'HR',      weight:0,   avgMin:0},
  {id:'inventory', label:'Store / inventory issue',        dept:'Store',   weight:0,   avgMin:0},
  {id:'other',     label:'Something else (not IT)',        dept:'Other',   weight:0,   avgMin:0},
];

const SEVERITY = {
  low:      {label:'Low',      mult:0.7},
  normal:   {label:'Normal',   mult:1.0},
  high:     {label:'High',     mult:1.4},
  critical: {label:'Critical', mult:1.8},
};

const DEFAULT_USERS = [
  {id:'u-admin',  username:'admin',    password:'admin123',   name:'Selam Admin',   title:'Administrator', isAdmin:true,  isIT:false},
  {id:'u-it',     username:'it',       password:'it123',      name:'Dawit (IT)',    title:'IT Support',    isAdmin:false, isIT:true},
  {id:'u-ceo',    username:'ceo',      password:'ceo123',     name:'Hana Bekele',   title:'CEO',            isAdmin:false, isIT:false},
  {id:'u-mgr',    username:'manager',  password:'manager123', name:'Yonas Tesfaye', title:'Manager',        isAdmin:false, isIT:false},
  {id:'u-store',  username:'store',    password:'store123',   name:'Meron Alemu',   title:'Store',          isAdmin:false, isIT:false},
  {id:'u-hr',     username:'hr',       password:'hr123',      name:'Kalkidan Fikru',title:'HR',              isAdmin:false, isIT:false},
  {id:'u-fin',    username:'finance',  password:'finance123', name:'Biruk Girma',   title:'Finance',        isAdmin:false, isIT:false},
];

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

function seedIfEmpty(){
  if(!localStorage.getItem(LS.users)) saveJSON(LS.users, DEFAULT_USERS);
  if(!localStorage.getItem(LS.categories)) saveJSON(LS.categories, DEFAULT_CATEGORIES);
  if(!localStorage.getItem(LS.tickets)) saveJSON(LS.tickets, []);
}
seedIfEmpty();

const DataLayer = {
  getUsers(){ return loadJSON(LS.users, []); },
  saveUsers(list){ saveJSON(LS.users, list); },
  getCategories(){ return loadJSON(LS.categories, DEFAULT_CATEGORIES); },
  saveCategories(list){ saveJSON(LS.categories, list); },
  getTickets(){ return loadJSON(LS.tickets, []); },
  saveTickets(list){ saveJSON(LS.tickets, list); },

  login(username, password){
    const users = this.getUsers();
    const u = users.find(x => x.username.toLowerCase() === username.trim().toLowerCase() && x.password === password);
    if(!u) return null;
    saveJSON(LS.session, {id:u.id});
    return u;
  },
  logout(){ localStorage.removeItem(LS.session); },
  currentUser(){
    const s = loadJSON(LS.session, null);
    if(!s) return null;
    return this.getUsers().find(u => u.id === s.id) || null;
  },
};

/* =====================================================================
   PRIORITY ENGINE
===================================================================== */
function scoreOf(ticket){
  const cat = DataLayer.getCategories().find(c => c.id === ticket.categoryId);
  const weight = cat ? cat.weight : 0;
  const mult = SEVERITY[ticket.severity] ? SEVERITY[ticket.severity].mult : 1;
  return Math.round(weight * mult);
}

function activeQueueSorted(){
  const tickets = DataLayer.getTickets().filter(t => t.status !== 'resolved');
  return tickets.sort((a,b) => (b.score - a.score) || (a.createdAt - b.createdAt));
}

function rankAndEtaFor(ticketId){
  const queue = activeQueueSorted();
  const idx = queue.findIndex(t => t.id === ticketId);
  if(idx === -1) return null;
  const cats = DataLayer.getCategories();
  let etaMinutes = 0;
  for(let i=0;i<idx;i++){
    const c = cats.find(c => c.id === queue[i].categoryId);
    etaMinutes += c ? c.avgMin : 15;
  }
  const own = cats.find(c => c.id === queue[idx].categoryId);
  etaMinutes += own ? Math.round(own.avgMin * 0.6) : 10;
  return { rank: idx + 1, total: queue.length, etaMinutes };
}

function ordinal(n){
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

===================================================================== */

function toast(msg){
  state.toast = msg;
  render();
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 2600);
}

function defaultTabFor(user){
  if(user.isAdmin) return 'admin-people';
  if(user.isIT) return 'it-queue';
  return 'new-request';
}

function timeAgo(ts){
  const mins = Math.max(0, Math.round((Date.now()-ts)/60000));
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+'h ago';
  return Math.round(hrs/24)+'d ago';
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- ticket stub renderer (shared) ---------- */
function ticketStub(t, opts){
  opts = opts || {};
  const cats = DataLayer.getCategories();
  const cat = cats.find(c => c.id === t.categoryId) || {label:t.categoryId};
  const users = DataLayer.getUsers();
  const requester = users.find(u => u.id === t.userId);
  const statusBadge = t.status==='resolved'
    ? `<span class="badge badge-resolved">RESOLVED</span>`
    : t.status==='in_progress'
      ? `<span class="badge badge-progress">IN PROGRESS</span>`
      : `<span class="badge badge-open">OPEN</span>`;
  const critBadge = (t.severity==='critical' && t.status!=='resolved') ? `<span class="badge badge-crit">CRITICAL</span>` : '';

  let rightBlock = '';
  if(t.status !== 'resolved'){
    const ra = rankAndEtaFor(t.id);
    if(ra){
      rightBlock = `<div class="rankline"><b>${ordinal(ra.rank)}</b> of ${ra.total} in queue<br>~${ra.etaMinutes} min est.</div>`;
    }
  } else if(t.resolvedAt){
    const mins = Math.max(1, Math.round((t.resolvedAt - t.createdAt)/60000));
    rightBlock = `<div class="rankline">Fixed in <b>${mins}</b> min</div>`;
  }

  const actions = opts.itControls ? `
    <div class="stubactions">
      ${t.status==='open' ? `<button class="btn btn-primary" data-action="start" data-id="${t.id}">Start</button>` : ''}
      ${t.status==='in_progress' ? `<button class="btn btn-primary" data-action="resolve" data-id="${t.id}">Resolve</button>` : ''}
    </div>` : '';

  return `
  <div class="stub">
    <div class="stubnum"><b>#${t.seq}</b><span>SCORE ${t.score}</span></div>
    <div class="stubbody">
      <div class="stubtitle">${esc(cat.label)}</div>
      <div class="stubmeta">
        ${opts.showRequester && requester ? `<span>${esc(requester.name)} · ${esc(requester.title)}</span>` : ''}
        <span>${timeAgo(t.createdAt)}</span>
        ${statusBadge} ${critBadge}
      </div>
      ${t.description ? `<div class="stubdesc">${esc(t.description)}</div>` : ''}
    </div>
    <div class="stubside">
      ${rightBlock}
      ${actions}
    </div>
  </div>`;
}

/* =====================================================================
   MAIN RENDER
===================================================================== */
function render(){
  const app = document.getElementById('app');
  state.user = DataLayer.currentUser();

  if(!state.user){
    app.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  if(!state.tab) state.tab = defaultTabFor(state.user);

  let inner = '';
  switch(state.tab){
    case 'new-request': inner = renderNewRequest(); break;
    case 'my-requests': inner = renderMyRequests(); break;
    case 'it-queue': inner = renderITQueue(); break;
    case 'it-resolved': inner = renderITResolved(); break;
    case 'admin-people': inner = renderAdminPeople(); break;
    case 'admin-categories': inner = renderAdminCategories(); break;
    default: inner = renderNewRequest();
  }
  app.innerHTML = renderShell(inner);
  bindShell();
}

/* =====================================================================
   BINDINGS
===================================================================== */
function bindLogin(){
  const numEl = document.getElementById('serving-num');
  if(numEl) animateCount(numEl, Number(numEl.dataset.target || 0));
  const form = document.getElementById('loginform');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const username = document.getElementById('f-user').value;
    const password = document.getElementById('f-pass').value;
    const u = DataLayer.login(username, password);
    if(!u){ state.loginError = 'Wrong username or password.'; render(); return; }
    state.loginError = '';
    state.tab = defaultTabFor(u);
    render();
  });
}

function bindShell(){
  document.getElementById('logoutbtn').addEventListener('click', () => {
    DataLayer.logout();
    state.tab = null;
    render();
  });
  document.querySelectorAll('.nav button[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.newTicket = { categoryId:'', severity:'normal', description:'' };
      setTab(btn.dataset.tab);
    });
  });

  bindNewRequest();
  bindITQueue();
  bindAdminPeople();
  bindAdminCategories();
}

function bindNewRequest(){
  const sel = document.getElementById('cat-select');
  if(sel){
    sel.addEventListener('change', () => {
      state.newTicket.categoryId = sel.value;
      render();
    });
  }
  document.querySelectorAll('.sevchip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.newTicket.severity = chip.dataset.sev;
      render();
    });
  });
  const desc = document.getElementById('desc-field');
  if(desc){
    desc.addEventListener('input', () => { state.newTicket.description = desc.value; });
  }
  const submitBtn = document.getElementById('submit-ticket');
  if(submitBtn){
    submitBtn.addEventListener('click', () => {
      const cat = DataLayer.getCategories().find(c => c.id === state.newTicket.categoryId);
      if(!cat || cat.dept !== 'IT') return;
      const descVal = document.getElementById('desc-field').value.trim();
      const tickets = DataLayer.getTickets();
      const seq = tickets.length + 1;
      const ticket = {
        id: 't-' + Date.now() + '-' + Math.random().toString(36).slice(2,7),
        seq,
        userId: state.user.id,
        categoryId: cat.id,
        severity: state.newTicket.severity,
        description: descVal,
        status: 'open',
        createdAt: Date.now(),
        resolvedAt: null,
      };
      ticket.score = scoreOf(ticket);
      tickets.push(ticket);
      DataLayer.saveTickets(tickets);
      state.newTicket = { categoryId:'', severity:'normal', description:'' };
      toast('Request sent to IT.');
      setTab('my-requests');
    });
  }
}

function bindITQueue(){
  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const tickets = DataLayer.getTickets();
      const t = tickets.find(x => x.id === id);
      if(!t) return;
      if(btn.dataset.action === 'start'){ t.status = 'in_progress'; }
      if(btn.dataset.action === 'resolve'){ t.status = 'resolved'; t.resolvedAt = Date.now(); }
      DataLayer.saveTickets(tickets);
      render();
    });
  });
}

function bindAdminPeople(){
  const form = document.getElementById('adduserform');
  if(form){
    form.addEventListener('submit', e => {
      e.preventDefault();
      const users = DataLayer.getUsers();
      const username = document.getElementById('nu-user').value.trim();
      if(users.some(u => u.username.toLowerCase() === username.toLowerCase())){
        toast('That username is already taken.');
        return;
      }
      const u = {
        id: 'u-' + Date.now(),
        name: document.getElementById('nu-name').value.trim(),
        title: document.getElementById('nu-title').value,
        username,
        password: document.getElementById('nu-pass').value,
        isIT: document.getElementById('nu-isit').checked,
        isAdmin: document.getElementById('nu-isadmin').checked,
      };
      users.push(u);
      DataLayer.saveUsers(users);
      toast('Account created for ' + u.name + '.');
      render();
    });
  }
  document.querySelectorAll('[data-deluser]').forEach(btn => {
    btn.addEventListener('click', () => {
      let users = DataLayer.getUsers();
      users = users.filter(u => u.id !== btn.dataset.deluser);
      DataLayer.saveUsers(users);
      render();
    });
  });
}

function bindAdminCategories(){
  document.querySelectorAll('[data-catweight]').forEach(inp => {
    inp.addEventListener('change', () => {
      const cats = DataLayer.getCategories();
      const c = cats.find(x => x.id === inp.dataset.catweight);
      if(c) c.weight = Math.max(0, Math.min(100, Number(inp.value)||0));
      DataLayer.saveCategories(cats);
      recomputeAllScores();
    });
  });
  document.querySelectorAll('[data-catmin]').forEach(inp => {
    inp.addEventListener('change', () => {
      const cats = DataLayer.getCategories();
      const c = cats.find(x => x.id === inp.dataset.catmin);
      if(c) c.avgMin = Math.max(0, Number(inp.value)||0);
      DataLayer.saveCategories(cats);
    });
  });
}

function recomputeAllScores(){
  const tickets = DataLayer.getTickets();
  tickets.forEach(t => { t.score = scoreOf(t); });
  DataLayer.saveTickets(tickets);
}

render();
</script>
